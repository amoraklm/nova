<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وبلاگ نووا</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <style>
        body {
            font-family: 'IRANSansXFaNum', system-ui, sans-serif;
            background: #0A0A0F;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
            transition: all 0.3s;
        }
        .login-box:hover {
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.05);
        }
        .login-box .logo {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .login-box h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .login-box .subtitle {
            color: #94A3B8;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            line-height: 1.7;
        }
        .login-box .subtitle strong {
            color: #A855F7;
            -webkit-text-fill-color: #A855F7;
        }
        .github-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #24292e;
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            text-decoration: none;
            width: 100%;
            max-width: 280px;
            margin: 0.5rem auto;
        }
        .github-login-btn:hover {
            background: #2f363d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .github-login-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .login-box .note {
            font-size: 0.7rem;
            color: #475569;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1rem;
        }
        .login-box .features {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 1.2rem 0;
            flex-wrap: wrap;
        }
        .login-box .features span {
            font-size: 0.75rem;
            color: #64748B;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .login-box .features span .icon {
            font-size: 0.9rem;
        }
        @media (max-width: 480px) {
            .login-box { padding: 1.8rem 1.2rem; }
            .login-box .logo { font-size: 2.8rem; }
            .login-box h1 { font-size: 1.3rem; }
            .github-login-btn { font-size: 0.85rem; padding: 0.6rem 1.2rem; }
            .login-box .features { gap: 0.8rem; }
            .login-box .features span { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <span class="logo">🚀</span>
        <h1>پنل مدیریت نووا</h1>
        <p class="subtitle">
            برای مدیریت وبلاگ، با <strong>گیت‌هاب</strong> خود وارد شوید.
        </p>

        <div class="features">
            <span><span class="icon">📝</span> نوشتن مقاله</span>
            <span><span class="icon">🖼️</span> افزودن تصویر</span>
            <span><span class="icon">📂</span> مدیریت دسته‌بندی</span>
            <span><span class="icon">🚀</span> انتشار فوری</span>
        </div>

        <!-- دکمه ورود با گیت‌هاب -->
        <a href="https://github.com/login/oauth/authorize?client_id=Ov231iuszmKuws6gS4Ny&scope=repo&redirect_uri=https://chatnova.ir/admin/" 
           class="github-login-btn">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            ورود با گیت‌هاب
        </a>

        <p class="note">🔒 فقط شما به این صفحه دسترسی دارید.</p>
    </div>

    <script>
        // ===== اگر Decap CMS به‌درستی لود نشد =====
        document.addEventListener('DOMContentLoaded', function() {
            // دکمه ورود از قبل در HTML وجود دارد
            console.log('🚀 پنل مدیریت نووا آماده است.');
        });
    </script>
</body>
</html>
